name: Store API Live Probe

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SE_PROBE_CHANNEL_ID: '5cc799026e852d26fcf16717'

jobs:
  live-probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/global.json', 'backend/Directory.Packages.props', 'backend/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      # One step per provider, so the log attributes a failure to the API that drifted.
      - name: Probe StreamElements
        run: dotnet test --no-restore --filter "Category=LiveProbe&FullyQualifiedName~StreamElementsApi"
        working-directory: backend

      # always(): a StreamElements failure must not hide a GauPoints regression.
      - name: Probe GauPoints
        if: always()
        run: dotnet test --no-restore --filter "Category=LiveProbe&FullyQualifiedName~GauPointsApi"
        working-directory: backend
