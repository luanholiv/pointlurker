coverage:
  status:
    project:
      default:
        enabled: false
    patch:
      default:
        enabled: true

flag_management:
  default_rules:
    carryforward: true

component_management:
  individual_components:
    - component_id: backend
      name: Backend (.NET)
      flag_regexes:
        - backend
      paths:
        - backend/src/**
      statuses:
        - type: project
          target: 80%
        - type: patch
          target: 80%

    - component_id: frontend
      name: Frontend (React)
      flag_regexes:
        - frontend
      paths:
        - frontend/src/**
      statuses:
        - type: project
          target: 80%
        - type: patch
          target: 80%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false
